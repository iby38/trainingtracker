<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E6E9E7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1316" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Training Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6E9E7; --surface:#F8FAF9; --surface2:#EDF0EE; --ink:#16202A; --muted:#5B6672; --line:#CBD2CE;
  --accent:#16202A; --onaccent:#F8FAF9; --good:#1D7F49; --goodbg:#DCEFE3; --warn:#9A4A06; --warnbg:#FCEBD6; --bad:#B91C1C; --badbg:#FBE1E1;
  --c-warmup:#7F8A92; --c-primer:#0E7490; --c-main:#C8102E; --c-secondary:#1D4ED8; --c-accessory:#C98F00; --c-core:#15803D; --c-conditioning:#E2550B; --c-test:#6D28D9;
  --p25:#C8102E; --p20:#1D4ED8; --p15:#E3B00A; --p10:#15803D; --p5:#F4F4F2; --p2:#22272B; --p1:#9CA3AF;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --navh:64px;
}
:root[data-theme="dark"]{
  --bg:#0F1316; --surface:#181E22; --surface2:#20272C; --ink:#E7ECEA; --muted:#9AA6AF; --line:#2D363C;
  --accent:#E7ECEA; --onaccent:#0F1316; --good:#4ADE80; --goodbg:#16301F; --warn:#FBBF24; --warnbg:#33260C; --bad:#F87171; --badbg:#3A1717;
  --c-warmup:#95A0A8; --c-primer:#22B3D4; --c-main:#F0485F; --c-secondary:#5B8CFF; --c-accessory:#F2BE2E; --c-core:#3DBE6E; --c-conditioning:#FF7A33; --c-test:#A78BFA;
  --p5:#DADAD6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1316; --surface:#181E22; --surface2:#20272C; --ink:#E7ECEA; --muted:#9AA6AF; --line:#2D363C;
    --accent:#E7ECEA; --onaccent:#0F1316; --good:#4ADE80; --goodbg:#16301F; --warn:#FBBF24; --warnbg:#33260C; --bad:#F87171; --badbg:#3A1717;
    --c-warmup:#95A0A8; --c-primer:#22B3D4; --c-main:#F0485F; --c-secondary:#5B8CFF; --c-accessory:#F2BE2E; --c-core:#3DBE6E; --c-conditioning:#FF7A33; --c-test:#A78BFA;
    --p5:#DADAD6;
  }
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--c-secondary);outline-offset:2px;border-radius:6px}
a{color:inherit}
.wrap{max-width:620px;margin:0 auto;padding:14px 14px calc(var(--navh) + 96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.005em;margin:0;line-height:1.05}
h1{font-size:40px}
h2{font-size:26px}
h3{font-size:20px}
p{margin:.4em 0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.wrapflex{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}
.sp{height:18px}

/* top bar */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 2px 14px}
.top .sub{font-size:14px;color:var(--muted);margin-top:4px}
.back{border:0;background:none;padding:6px 8px 6px 0;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.rolepill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.rolepill.coach{background:var(--c-secondary);color:#fff;border-color:transparent}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.chip.strong{background:var(--ink);color:var(--onaccent);border-color:transparent}
.chip.deload{background:var(--goodbg);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--badbg);color:var(--bad);border-color:transparent}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.panel.flat{border-radius:12px;padding:12px 14px}
.hero{border-radius:20px;padding:18px;background:var(--ink);color:var(--onaccent);border:0;position:relative;overflow:hidden}
.hero .muted{color:inherit;opacity:.72}
.hero .chip{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);color:inherit}
:root[data-theme="dark"] .hero .chip{background:rgba(0,0,0,.08);border-color:rgba(0,0,0,.15)}
.hero .bar{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c-main)}
.notice{border-radius:12px;padding:12px 14px;background:var(--warnbg);color:var(--warn);font-size:14px}
.notice.good{background:var(--goodbg);color:var(--good)}
.notice b{font-weight:600}

/* buttons */
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--accent);color:var(--onaccent);min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.soft{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--badbg);color:var(--bad)}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:10px}
.hero .btn{background:var(--onaccent);color:var(--ink)}
.linkbtn{border:0;background:none;padding:0;color:var(--c-secondary);font-weight:600;font-size:14px}

/* week strip */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.day{text-align:center;padding:8px 0 7px;border-radius:10px;font-size:12px;color:var(--muted);background:transparent;border:0}
.day b{display:block;font-family:var(--display);font-size:20px;color:var(--ink);font-weight:600;line-height:1.1}
.day.today{background:var(--surface);outline:1.5px solid var(--ink)}
.day .dot{display:block;width:8px;height:8px;border-radius:50%;margin:4px auto 0;background:transparent}
.day .dot.s{background:var(--line)}
.day .dot.done{background:var(--good)}
.day .dot.part{background:var(--c-accessory)}
.day .dot.miss{background:var(--bad)}
.day .dot.sport{background:transparent;border:1.5px solid var(--muted);width:7px;height:7px}

/* plan list */
.weeksel{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.weeksel::-webkit-scrollbar{display:none}
.wk{flex:0 0 auto;min-width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--display);font-size:20px;font-weight:600;position:relative}
.wk.on{background:var(--ink);color:var(--onaccent);border-color:var(--ink)}
.wk.dl::after{content:"";position:absolute;left:50%;bottom:5px;width:14px;height:3px;margin-left:-7px;border-radius:2px;background:var(--good)}
.wk.cur{border-color:var(--ink)}
.scard{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;position:relative}
.scard .when{font-size:13px;color:var(--muted)}
.scard h3{margin:2px 0 6px}
.scard .lifts{font-size:14px;color:var(--muted)}
.scard .lifts b{color:var(--ink);font-weight:600}
.status{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.status.done{background:var(--goodbg);color:var(--good)}
.status.part{background:var(--warnbg);color:var(--warn)}
.status.miss{background:var(--badbg);color:var(--bad)}
.status.today{background:var(--ink);color:var(--onaccent)}
.status.up{background:var(--surface2);color:var(--muted)}

/* session */
.cathead{display:flex;align-items:center;gap:8px;margin:22px 2px 8px;font-family:var(--display);font-size:19px;font-weight:600}
.cathead i{width:12px;height:12px;border-radius:3px;display:inline-block}
.group{border-radius:16px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.group+.group{margin-top:10px}
.group .gtag{font-size:12px;font-weight:600;color:var(--muted);padding:8px 14px 0;display:flex;align-items:center;gap:6px}
.item{padding:14px 14px 14px 18px;position:relative}
.item+.item{border-top:1px dashed var(--line)}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--cc)}
.ihead{display:flex;gap:10px;align-items:flex-start}
.code{flex:0 0 auto;min-width:32px;height:26px;padding:0 6px;border-radius:7px;background:var(--cc);color:#fff;font-family:var(--display);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.iname{font-weight:600;font-size:16px;line-height:1.3;border:0;background:none;padding:0;text-align:left}
.iname:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.presc{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:14px;color:var(--muted)}
.presc b{color:var(--ink);font-weight:600}
.loadbox{display:flex;align-items:flex-end;gap:14px;margin-top:10px;flex-wrap:wrap}
.stamp{font-family:var(--display);font-weight:700;font-size:44px;line-height:.9;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stamp small{font-size:18px;font-weight:600;margin-left:3px;color:var(--muted)}
.stamp .pct{display:block;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-top:4px;font-family:var(--body)}
.loadtext{margin-top:8px;font-size:14px;font-weight:500;padding:6px 10px;border-radius:8px;background:var(--surface2);display:inline-block}
.plates{display:flex;align-items:center;height:48px;gap:2px}
.plates .barend{width:16px;height:6px;background:var(--muted);border-radius:2px}
.plates .collar{width:5px;height:16px;background:var(--muted);border-radius:1px;margin-right:2px}
.plate{width:9px;border-radius:2px;border:1px solid rgba(0,0,0,.25)}
.plates .lbl{font-size:12px;color:var(--muted);margin-left:8px;line-height:1.25;max-width:150px}
.warmsets{margin-top:8px;font-size:13px;color:var(--muted)}
.warmsets b{color:var(--ink);font-weight:600}
.last{margin-top:6px;font-size:13px;color:var(--muted)}
.last b{color:var(--ink);font-weight:600}
details.notes{margin-top:8px;font-size:14px}
details.notes summary{cursor:pointer;color:var(--muted);font-weight:500;list-style:none;display:inline-flex;align-items:center;gap:4px}
details.notes summary::-webkit-details-marker{display:none}
details.notes summary::before{content:"+";font-weight:700;width:14px}
details.notes[open] summary::before{content:"\2212"}
details.notes .nbody{padding:6px 0 0 18px}
.form{margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--surface2)}
.edited{font-size:12px;font-weight:600;color:var(--c-secondary)}

/* set logging */
.sets{margin-top:12px;display:grid;gap:6px}
.setrow{display:grid;grid-template-columns:30px 1fr 18px 1fr 48px;gap:6px;align-items:center}
.setrow.one{grid-template-columns:30px 1fr 48px}
.setrow .sn{font-family:var(--display);font-weight:600;color:var(--muted);font-size:17px;text-align:center}
.setrow .x{text-align:center;color:var(--muted)}
.inp{width:100%;min-width:0;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);padding:0 10px;font-family:var(--display);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.inp::placeholder{color:var(--muted);opacity:.55;font-weight:500}
.inp.txt{font-family:var(--body);font-size:15px;font-weight:500}
.unit{position:relative}
.unit span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.tick{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;padding:0}
.tick svg{width:22px;height:22px;stroke:var(--muted)}
.tick.on{background:var(--good);border-color:var(--good)}
.tick.on svg{stroke:#fff}
.setrow.done .inp{border-color:transparent;background:var(--goodbg)}
.checkbtn{margin-top:10px;width:100%;height:44px;border-radius:10px;border:1.5px dashed var(--line);background:transparent;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.checkbtn.on{border-style:solid;border-color:var(--good);background:var(--goodbg);color:var(--good)}
.rpe{display:flex;gap:4px;margin-top:10px;align-items:center;flex-wrap:wrap}
.rpe .lab{font-size:13px;color:var(--muted);margin-right:4px}
.rpe button{width:36px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-size:17px;font-weight:600}
.rpe button.on{background:var(--ink);color:var(--onaccent);border-color:var(--ink)}
.cmt{margin-top:8px}
.cmt .inp{height:40px}
.stations{margin-top:10px;display:grid;gap:8px}
.station{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:start;padding:8px 0;border-top:1px dashed var(--line)}
.station .code{min-width:30px;height:24px;font-size:14px}
.station .sname{font-weight:600}
.station .sdet{font-size:13px;color:var(--muted)}
.item.compact{padding:10px 12px 10px 18px}
.crow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center}
.crow .tick{width:48px}
.crow .iname{font-size:15px}
.liftrow{padding:12px 0;border-top:1px solid var(--line)}
.liftrow:first-of-type{border-top:0}
.findit{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--warnbg);color:var(--warn);font-size:14px}
.findit .btn{margin-top:8px}

/* finish */
.finish{margin-top:24px}
textarea.inp{height:auto;min-height:84px;padding:10px;font-family:var(--body);font-size:15px;font-weight:400;line-height:1.45;resize:vertical}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 5px}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.scale.s5{grid-template-columns:repeat(5,1fr)}
.scale.s3{grid-template-columns:repeat(3,1fr)}
.scale button{height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-size:18px;font-weight:600;padding:0 4px}
.scale.s3 button{font-family:var(--body);font-size:14px}
.scale button.on{background:var(--ink);color:var(--onaccent);border-color:var(--ink)}
.coachnote{border-left:4px solid var(--c-secondary);background:var(--surface);border-radius:4px 12px 12px 4px;padding:10px 14px;margin-bottom:12px}
.coachnote b{color:var(--c-secondary)}
.ticker{font-family:var(--display);font-size:22px;font-weight:600}

/* rest timer */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 10px + env(safe-area-inset-bottom,0px));width:min(592px,calc(100% - 24px));background:var(--ink);color:var(--onaccent);border-radius:16px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.timer .t{font-family:var(--display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;min-width:76px}
.timer .lab{flex:1;font-size:13px;opacity:.8;line-height:1.3}
.timer button{border:0;border-radius:10px;height:38px;padding:0 12px;font-weight:600;background:rgba(255,255,255,.14);color:inherit}
:root[data-theme="dark"] .timer button{background:rgba(0,0,0,.1)}
.timer .prog{position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px;overflow:hidden}
.timer .prog i{display:block;height:100%;background:var(--c-accessory)}
.timer.over{background:var(--good);color:#fff}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--navh)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font-size:11.5px;font-weight:600;color:var(--muted)}
nav.tabs a svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a.on{color:var(--ink)}
nav.tabs a .badge{position:absolute;margin:-18px 0 0 22px;width:8px;height:8px;border-radius:50%;background:var(--bad)}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(620px,100%);max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 12px}

/* tables & lists */
.kv{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n{font-family:var(--display);font-size:17px;font-weight:600;white-space:nowrap}
.scroll{overflow-x:auto}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.menu a,.menu button{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:14px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-decoration:none;font-weight:500}
.menu a:last-child{border-bottom:0}
.menu .chev{color:var(--muted)}
.libitem{padding:12px 0;border-bottom:1px solid var(--line)}
.libitem:last-child{border-bottom:0}
.search{width:100%;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:15px}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--body);font-size:11px;fill:var(--muted)}
.flag{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.flag:first-child{border-top:0}
.flag i{flex:0 0 10px;height:10px;border-radius:50%;margin-top:6px}
.disabled{opacity:.6}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--onaccent);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
  .tick.on{animation:pop .18s ease-out}
  @keyframes pop{from{transform:scale(.9)}to{transform:none}}
}
@media (min-width:700px){ h1{font-size:46px} .stamp{font-size:50px} }
</style>

then conditioning last. Always in the order written."],["Supersets","Rows with the same number and a letter (2a and 2b) are done back to back: one set of a, about 30s, one set of b, then the rest shown."],["Week A and B","Accessories alternate each week, so each area is trained every other week."],["Martial arts","Lift first, mat after. Same day is fine (gym in the morning, mat in the evening, or straight after). Never the mat before heavy lifting."],["How to fill it in",""],["Yellow cells only","Everything you fill in is yellow. Do not change any other cell."],["Weights","Barbell weights are the total on the bar, including the bar (20 kg), not per side. Warm up sets are the same. Dumbbell and kettlebell weights are per hand."],["Set 1 to Set 5","Write what you actually did. Weight x reps for lifts (70x5), time for holds and carries (45s), distance or calories for conditioning."],["Example","Target 70 kg for 3 x 5. You did 70x5, 70x5, 70x4. Write Set 1 = 70x5, Set 2 = 70x5, Set 3 = 70x4."],["Used a different weight?","That is fine. Write the weight you actually used, and add a few words in Your comments on why."],["RPE (1-10)","How hard the last set was. 10 = nothing left, 9 = 1 rep left, 8 = about 2 left, 7 = about 3 left, 6 = about 4 left."],["End of each session","Fill in the log rows under the session: completed Y or N, time taken, session RPE, and anything to flag."],["Check-ins tab","Once a week, by Saturday night, fill in one line. This is what I use to adjust your next week."],["The rules",""],["1. Weekly update","Send me your weekly summary and update this sheet by Saturday night every week, so I can adjust the next week."],["2. Missed sessions","If you miss a session, tell me. Do not cram two sessions into one day to catch up. I will adjust the week."],["3. Problems","If anything hurts, feels wrong, or life gets in the way, tell me straight away. If I hear nothing, I assume training is going fine."],["4. Pain","Normal soreness (DOMS) is fine, see Recovery and Fuel. Mild discomfort up to 3 out of 10 that is not worse the next day is fine. Sharp pain, or pain that is worse the next day: stop that exercise and message me."],["5. Too easy or too hard","The numbers are a best guess. Do them as best you can and tell me if a session felt too easy or too hard."],["6. Changes","Message me if you want a change. You can suggest an exercise swap, but this plan is not built on social media trends. If I say no, there is a reason."],["Colour key",""],["Warm up",""],["Primer and bridge",""],["Main lifts",""],["Secondaries",""],["Accessories",""],["Core and finishers",""],["Conditioning",""],["Tests",""],["Your input (yellow)","You fill these in"],["Coach only (blue)","Leave these to me"],["Tabs",""],["Introduction","This page."],["Profile","Your details and starting numbers. Every weight comes from here."],["Check-ins","Your weekly line, due Saturday night."],["Week 1 to 12, Testing Week","Your sessions. Fill in the yellow columns as you train. The Testing Week comes after week 12."],["Tests","Your starting numbers against your Testing Week numbers."],["Warm Ups","Pre lift, pre run and daily flexibility routines."],["Recovery and Fuel","Your calorie and protein targets, sleep, soreness (DOMS), fuelling long sessions and supplements."],["Exercise Library","Key cue for each exercise."],["Terms",""],["RPE","Rate of perceived exertion. How hard a set was on a 1 to 10 scale. RPE 8 means about 2 reps left."],["1RM and Est. 1RM","One rep max, the most you can lift once. Est. 1RM is worked out from a set of 3 to 5, so you never have to test a true max."],["Training Max (TM)","90% of your Est. 1RM. Your main lift weights are a percentage of this, e.g. 70% TM."],["Main lifts","Squat, deadlift, the two main presses and the two main pulls. The heaviest work of the day."],["Secondaries","Supporting lifts after the main lifts, such as single leg work, rows and push up variations."],["Accessories","Smaller isolation work for the areas the big lifts miss: arms, shoulders, calves, neck and so on."],["Primer","Light jumps after the warm up to wake the legs up. Short, bouncy, not tiring."],["Bridge","One set of a fast movement in the same shape as the main lift, e.g. squat jumps before squats."],["Contrast jump","A few max effort jumps about 30s after a heavy set of squats or deadlifts. The heavy set makes the jump more explosive."],["Superset","Two exercises done back to back, then rest."],["Deload","A lighter week at the end of each cycle so your body recovers and adapts."],["Cycle and block","A cycle is 4 weeks (3 build, 1 deload). A block is 3 cycles, this 12 week plan."],["Double progression","Pick a rep range. Add a rep each session until you hit the top of the range on every set, then add the smallest weight and start again at the bottom."],["Step loading","Keep the same weight and add sets and reps each week (3x3, 4x3, 4x4, 5x4, 5x5). Then add weight and start again."],["Tendon hold","On the last rep of the last set, hold the position for 30 to 45s. Keeps tendons healthy."],["AMRAP","As many rounds (or reps) as possible in the time given."],["EMOM","Every minute on the minute. Start the reps at the top of each minute and rest for whatever is left."],["Rounds / for time","Rounds: go through all the stations a set number of times. For time: the same, as fast as you can with good form."],["Zone 2","Easy aerobic work. You can hold a conversation and breathe through your nose."],["Intervals","Repeated runs at your target pace with rest between. Your target pace is on the Profile tab."],["Hill or shuttle sprint","Short, fast effort of 20 to 30s up a hill or back and forth over a short distance."],["VO2","Short hard efforts on a machine, such as 30s on the assault bike."],["Ruck","Walking with a loaded backpack. Easy pace, about 9:20 per km."],["Build up strides","2 or 3 runs of about 60 m, building from easy to fast, before intervals or sprints."],["Brace","Big breath into your belly and push out in every direction before a heavy rep. Hold it through the rep."],["BW, DB, KB","Bodyweight, dumbbell, kettlebell."],["Pick","Choose the load yourself using the rep range and RPE given. Keep the same load next session and build reps."],["Find it","No number on your Profile yet. Build up to a set of 5 at RPE 8 and write it on your Profile."],["Per side / per leg","Do the reps on each side, e.g. 6 per leg = 6 left and 6 right."],["Effort words (Effort column)",""],["70% TM","Percentage of your Training Max. The weight is already worked out for you."],["RPE 6 to 9","How hard the set should feel. See RPE above."],["Bouncy","Light, quick, springy contacts with the ground. Not tiring at all."],["Quality","Controlled, perfect reps. Stick every landing. Stop before it gets sloppy."],["Explosive / Max intent","Every rep as fast and powerful as you can. Full rest. Stop if height or speed drops."],["Snappy / Fast","Quick and crisp, but not all out. Stop the set if speed drops."],["Heavy","A load that is hard to hold for the full distance or time, but your posture never breaks."],["Hard","Close to your limit for that piece, but you can repeat it every round."],["Steady","A pace you can hold for every round without slowing down."],["Smooth","Controlled reps with no kipping or swinging, well inside your limit."],["Target pace","The pace on your Profile for that distance."],["Zone 2 / Conversational","Easy. You can talk in full sentences and breathe through your nose."],["Easy","Well within yourself. Recovery work."],["Max","Test effort: as many reps, as long, or as far as you can with good form."]],"lib":[{"ex":"Ankle rehab: single leg calf raise and ankle circles","cue":"Slow calf raises on the recovering ankle first, full range, then slow circles both ways.","video":""},{"ex":"Low pogo hops","cue":"Stay on the balls of the feet, knees almost straight, bounce off the ground fast.","video":""},{"ex":"Forward and back hops, both legs","cue":"Small hops forward then back on both feet, land soft /* ============================================================
   Training Tracker preview

const DAY = 86400000;
const CATS = {
  warmup:{name:"Warm up"}, primer:{name:"Primer and bridge"}, main:{name:"Main lifts"},
  secondary:{name:"Secondaries"}, accessory:{name:"Accessories"}, core:{name:"Core and finishers"},
  conditioning:{name:"Conditioning"}, test:{name:"Tests"}
};
const LIFTS = ["squat","hinge","hpress","vpress"];
const PULLS = ["vpull","hpull"];
const LIFT_LABEL = {squat:"Squat",hinge:"Hinge (deadlift)",hpress:"Horizontal press",vpress:"Vertical press",vpull:"Vertical pull",hpull:"Horizontal pull"};

const PLATES = [25,20,15,10,5,2.5,1.25];

const isCoach = () => S.settings.role === "coach";

/* ---------- small helpers ---------- */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => (v===null||v===undefined||v===""||isNaN(+v)) ? null : +v;
const xround = x => Math.sign(x)*Math.round(Math.abs(x)+1e-9);          // Excel ROUND(x,0): halves away from zero
const r25 = x => xround(x/2.5)*2.5;                                     // nearest 2.5 kg, same as the sheet
const fmtKg = x => (Math.round(x*100)/100).toString();
const pad = n => String(n).padStart(2,"0");
function parseDate(s){ const [y,m,d]=String(s).split("-").map(Number); return new Date(y,(m||1)-1,d||1); }
function today(){ const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
const addDays = (d,n) => new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const dayDiff = (a,b) => Math.round((b-a)/DAY);
const fmtD = (d,o) => d.toLocaleDateString("en-GB", o||{weekday:"short",day:"numeric",month:"short"});
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function setPath(obj,path,val){
  const k=path.split("/"); let o=obj;
  for(let i=0;i<k.length-1;i++){ if(o[k[i]]==null||typeof o[k[i]]!=="object") o[k[i]]={}; o=o[k[i]]; }
  o[k[k.length-1]]=val;
}
function getPath(obj,path){ return path.split("/").reduce((o,k)=>o==null?undefined:o[k],obj); }
function mmss(sec){ sec=Math.max(0,Math.round(sec)); return Math.floor(sec/60)+":"+pad(sec%60); }
function parseMMSS(s){ if(s==null||s==="") return null; s=String(s).trim(); const m=s.match(/^(\d+):(\d{1,2})$/); if(m) return +m[1]*60+ +m[2]; return num(s)!=null? +s*60 : null; }

/* ---------- plan maths (mirrors the spreadsheet formulas) ---------- */
function e1rm(w,r){ w=num(w); r=num(r); if(w==null||r==null||r<=0) return null; return r===1? w : w*r*0.033+w; }
function liftE1(k){ const l=S.profile.lifts[k]; return l? e1rm(l.w,l.r) : null; }
function tm(k,cycle){ const e=liftE1(k); if(e==null) return null; const t1=r25(e*0.9); return t1+(cycle-1)*(num(S.profile.lifts[k].inc)||0); }
function stepLoad(k,step){ const p=S.profile.pulls[k]; const s=num(p&&p.start); return s==null? null : s+(num(p.inc)||0)*step; }
function liftName(k){ return (S.profile.lifts[k]||S.profile.pulls[k]||{}).name || LIFT_LABEL[k]; }
const W = DATA.weeks;
const sid = (wi,si) => "w"+wi+"s"+si;
function sessDate(wi,si){ return addDays(parseDate(S.profile.start), W[wi].sessions[si].day); }
function weekStart(wi){ return addDays(parseDate(S.profile.start), wi*7); }
function curWeek(){ const d=dayDiff(parseDate(S.profile.start), today()); if(d<0) return {wi:0,pre:true,days:-d}; return {wi:Math.min(W.length-1,Math.floor(d/7)), pre:false, post:d>=W.length*7}; }
const isDeload = w => /deload/i.test(w.phase||"");

function restSec(s){
  if(!s) return 0; s=String(s);
  let m=s.match(/^(\d+)\s*-\s*(\d+)\s*min/); if(m) return (+m[1]+ +m[2])/2*60;
  m=s.match(/^(\d+)\s*min/); if(m) return +m[1]*60;
  m=s.match(/^(\d+)\s*s\b/); if(m) return +m[1];
  return 0;
}

/* Resolve one plan row into what the athlete sees, using the profile and any coach edits. */
function R(wi,si,ii){
  const base = W[wi].sessions[si].items[ii];
  const ed = S.edits[wi+"."+si+"."+ii] || null;
  const it = Object.assign({}, base, ed||{});
  const P = S.profile, wk = W[wi];
  const o = {wi,si,ii, code:it.code, cat:it.cat, kind:it.kind, n:it.n, edited:!!ed, base};
  o.liftKey = (typeof base.ex==="object") ? base.ex.lift : null;
  o.name = (typeof it.ex==="object") ? liftName(it.ex.lift) : it.ex;
  o.sets = it.sets!=null? String(it.sets) : "";
  if(ed && ed.sets!=null){ const m=String(ed.sets).match(/\d+/); if(m && o.kind!=="circuit" && o.kind!=="station") o.n=Math.min(10,+m[0]); }
  // reps
  let reps = it.reps;
  if(reps && typeof reps==="object"){
    if(reps.t==="pullreps"){ const m=num(P.tests.pullups); reps = m==null? reps.fb : String(xround(m*reps.f)+reps.k); }
    else if(reps.t==="z2"){ const z=num(P.z2)||30; reps = xround(Math.min(z+reps.step*reps.k, reps.cap)*reps.f)+" min"; }
  }
  o.reps = reps==null? "" : String(reps);
  // load
  const L = it.load; o.load=null; o.loadText=""; o.pct=""; o.perHand=false; o.added=false;
  if(L && typeof L==="object"){
    if(L.t==="tm"){ const t=tm(L.lift,L.cycle); if(t==null) o.loadText=L.fb; else { o.load=r25(t*L.pct); o.pct=Math.round(L.pct*100)+"% of training max"; } }
    else if(L.t==="step"){ const v=stepLoad(L.lift,L.k); if(v==null) o.loadText=L.fb; else { o.load=v; o.added = L.lift==="vpull"; } }
    else if(L.t==="carry"){ const bw=num(P.bw); if(bw==null) o.loadText=L.fb; else { o.load=xround(bw*L.f/2/2)*2; o.perHand=true; } }
    else if(L.t==="pref"){ const v=num(P.ruck); if(v!=null){ o.load=v+L.add; o.pack=true; } else o.loadText="Pick: 10 to 15% of bodyweight"; }
  } else if(L!=null && L!==""){
    if(ed && ed.load!=null && num(ed.load)!=null){ o.load=+ed.load; } else o.loadText=String(L);
  }
  if(o.kind==="wt" && o.load!=null) o.perHand=true;
  o.effort = it.effort||""; o.rest = it.rest||""; o.ss = it.ss||"";
  // warm up sets
  o.warm = "";
  if(it.warm && typeof it.warm==="object"){
    if(o.load!=null){
      const bar = o.liftKey==="hinge" ? (num(S.settings.trapbar)||20) : (num(S.settings.bar)||20);
      const steps=[["Bar",5]]; const seen=new Set([bar]);
      [[.5,5],[.75,3]].forEach(([p,r])=>{ const w=r25(o.load*p); if(w>bar && w<o.load && !seen.has(w)){ seen.add(w); steps.push([w,r]); } });
      o.warm = steps.map(([w,r])=>(w==="Bar"?"Bar":fmtKg(w))+" × "+r).join(", ");
    } else o.warm = "Bar × 5, then 3 to 4 jumps";
  } else if(it.warm) o.warm = String(it.warm).replace(/ x(\d)/g," × $1");
  // notes
  let n = it.notes;
  if(n && typeof n==="object"){ const has = tm(n.lift,1)!=null; n = [n.pre, has? n.yes : n.no, n.post].filter(Boolean).join(" "); }
  o.notes = n||"";
  const lib = DATA.lib.find(x=>x.ex===o.name) || (o.liftKey && DATA.lib.find(x=>x.ex===liftName(o.liftKey)));
  o.form = it.form || (lib && lib.cue) || "";
  o.video = S.videos[o.name] || (lib && lib.video) || "";
  o.isBarbell = !!(o.liftKey && BARBELL[o.liftKey] && o.load!=null);
  o.target = firstNum(o.reps);
  if(o.kind==="t"||o.kind==="wt"){ const m=o.reps.match(/(\d+)\s*s\b/); o.targetT = m? +m[1] : null; }
  return o;
}
function firstNum(s){ const m=String(s||"").match(/\d+/); return m? +m[0] : null; }

function platesFor(total, bar){
  let side = (total-bar)/2; if(side<0) return null;
  const out=[]; for(const p of PLATES){ while(side>=p-1e-9){ out.push(p); side-=p; } }
  return {plates:out, rest:Math.round(side*100)/100};
}

/* ---------- logs ---------- */
function log(wi,si,create){ const k=sid(wi,si); if(!S.logs[k] && create) S.logs[k]={items:{}}; return S.logs[k]; }
function ilog(wi,si,ii,create){ const L=log(wi,si,create); if(!L) return null; if(!L.items[ii] && create) L.items[ii]={sets:{}}; return L.items[ii]; }
function sessStatus(wi,si){
  const L=log(wi,si); const d=dayDiff(today(),sessDate(wi,si));
  if(L&&L.done) return "done";
  if(L&&L.missed) return "miss";
  if(L&&Object.keys(L.items||{}).some(k=>{const x=L.items[k]; return x.done||Object.values(x.sets||{}).some(s=>s.done)||x.rounds;})) return "part";
  if(d===0) return "today";
  if(d<0) return "past";
  return "up";
}
const STATUS_TXT = {done:"Done",miss:"Missed",part:"In progress",today:"Today",past:"Not logged",up:"Upcoming"};
function sessionProgress(wi,si){
  const items=W[wi].sessions[si].items; let tot=0, dn=0; const L=log(wi,si);
  items.forEach((it,ii)=>{
    if(it.kind==="station") return;
    const x=L&&L.items[ii]; const o=R(wi,si,ii);
    if(it.kind==="check"||it.kind==="cardio"||it.kind==="circuit"||it.kind==="runtime"){ tot++; if(x&&(x.done||x.rounds)) dn++; }
    else { tot+=o.n; if(x) dn+=Object.values(x.sets||{}).filter(s=>s.done).length; }
  });
  return {tot,dn};
}
/* Most recent earlier performance of the same exercise name */
function lastTime(name, wi, si){
  const before = sessDate(wi,si);
  let best=null;
  W.forEach((w,a)=>w.sessions.forEach((s,b)=>{
    const d=sessDate(a,b); if(d>=before) return;
    const L=log(a,b); if(!L) return;
    s.items.forEach((it,c)=>{
      const x=L.items[c]; if(!x) return;
      const done=Object.keys(x.sets||{}).sort((p,q)=>p-q).map(k=>x.sets[k]).filter(z=>z.done);
      if(!done.length) return;
      if(R(a,b,c).name!==name) return;
      if(!best||d>best.d) best={d,sets:done,kind:it.kind,a,b};
    });
  }));
  return best;
}
function setStr(s,kind){
  if(kind==="wr") return (s.w!=null&&s.w!==""? fmtKg(s.w)+"×":"")+(s.r!=null&&s.r!==""? s.r : "");
  if(kind==="wt") return (s.w!=null&&s.w!==""? fmtKg(s.w)+" kg ":"")+(s.t!=null&&s.t!==""? s.t+"s":"");
  if(kind==="t") return (s.t!=null&&s.t!==""? s.t+"s":"");
  if(kind==="cm") return (s.v!=null&&s.v!==""? s.v+" cm":"");
  return s.r!=null&&s.r!==""? String(s.r) : (s.v||"");
}
function bestE1(x){
  let b=null; Object.values((x&&x.sets)||{}).forEach(s=>{ if(!s.done) return; const r=num(s.r), w=num(s.w); if(r==null||w==null||r>10) return; const e=e1rm(w,r); if(e!=null&&(b==null||e>b)) b=e; }); return b;
}
function weekStats(wi){
  const w=W[wi]; let done=0, rpes=[];
  w.sessions.forEach((s,si)=>{ const L=log(wi,si); if(L&&L.done){ done++; if(num(L.rpe)!=null) rpes.push(+L.rpe); } });
  return {planned:w.sessions.length, done, rpe: rpes.length? Math.round(rpes.reduce((a,b)=>a+b,0)/rpes.length*10)/10 : null};
}
function missingSetup(){
  const P=S.profile, out=[];
  if(num(P.bw)==null) out.push({k:"bw",t:"Bodyweight",why:"needed for carries, calories and protein"});
  LIFTS.forEach(k=>{ const l=P.lifts[k]; if(e1rm(l.w,l.r)==null) out.push({k,t:l.name,why:"finds itself in week 1"}); });
  PULLS.forEach(k=>{ const p=P.pulls[k]; if(num(p.start)==null) out.push({k,t:p.name+" start load",why:"pick it in week 1"}); });
  return out;
}

function route(){ const h=(location.hash||"#/today").slice(2).split("/"); return {p:h[0]||"today", a:h[1], b:h[2]}; }
function go(h){ if(location.hash===h) render(); else location.hash=h; }
window.addEventListener("hashchange",()=>{ render(); window.scrollTo(0,0); });

function render(){
  const r=route(); const app=document.getElementById("app");
  document.documentElement.dataset.theme = S.settings.theme==="auto" ? "" : S.settings.theme;

    switch(r.p){
      case "today": html = isCoach()? vCoach() : vToday(); break;

/* ============================ today ============================ */
function weekChips(w){

function sportOn(d){
  const txt=(S.profile.sport||"")+" "+(S.profile.days||"");
  const names=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]; const n=names[d.getDay()];
  const out=[]; const re=/(Mon|Tue|Wed|Thu|Fri|Sat|Sun)(?:\s+and\s+(Mon|Tue|Wed|Thu|Fri|Sat|Sun))?:\s*([^.]+)/g; let m;

}
function liftsLine(wi,si){

  if(!parts.length){ const c=[]; its.forEach((it,ii)=>{ if(it.cat==="warmup"||it.cat==="primer"||it.kind==="station") return; const o=R(wi,si,ii); c.push(`<b>${esc(o.name)}</b> ${esc(o.kind==="r"&&o.sets?o.sets+" × "+o.reps:o.reps)}`); }); return c.join(" &nbsp;/&nbsp; "); }

/* ============================ session ============================ */
function groupsOf(wi,si){
  const items=W[wi].sessions[si].items; const out=[]; let i=0;
  while(i<items.length){
    const it=items[i];
    if(it.kind==="circuit"){ const g={type:"circuit",idx:[i],st:[]}; let j=i+1; while(j<items.length&&items[j].kind==="station"){g.st.push(j);j++;} out.push(g); i=j; continue; }
    const m=it.code.match(/^(\d+)[a-z]$/);
    if(m && it.ss && /^(Yes|Contrast)/.test(it.ss)){
      const g={type:"ss",idx:[i],label:/^Contrast/.test(it.ss)?"Contrast pair":"Superset"}; let j=i+1;
      while(j<items.length){ const m2=items[j].code.match(/^(\d+)[a-z]$/); if(m2&&m2[1]===m[1]&&/^(Yes|Contrast)/.test(items[j].ss||"")){g.idx.push(j);j++;} else break; }
      out.push(g); i=j; continue;
    }
    out.push({type:"one",idx:[i]}); i++;
  }
  return out;
}

        h+=`<div class="setrow ${z.done?"done":""}"><span class="sn">${n+1}</span><div class="unit"><input class="inp" inputmode="decimal" data-bind="${sb}/w" value="${esc(z.w??"")}" placeholder="${ph}" aria-label="Set ${n+1} kg"><span>kg</span></div><span class="x">×</span><div class="unit"><input class="inp" inputmode="numeric" data-bind="${sb}/r" value="${esc(z.r??"")}" placeholder="${o.target??""}" aria-label="Set ${n+1} reps"><span>reps</span></div>${TICK(z.done,`data-a="tick" ${kk}`,"Set "+(n+1)+" done")}</div>`;
      } else if(o.kind==="wt"){
        h+=`<div class="setrow ${z.done?"done":""}"><span class="sn">${n+1}</span><div class="unit"><input class="inp" inputmode="decimal" data-bind="${sb}/w" value="${esc(z.w??"")}" placeholder="${ph}" aria-label="Set ${n+1} kg per hand"><span>kg</span></div><span class="x">,</span><div class="unit"><input class="inp" inputmode="numeric" data-bind="${sb}/t" value="${esc(z.t??"")}" placeholder="${o.targetT??""}" aria-label="Set ${n+1} seconds"><span>sec</span></div>${TICK(z.done,`data-a="tick" ${kk}`,"Set "+(n+1)+" done")}</div>`;
      } else {
        const fld = o.kind==="t"?"t": o.kind==="cm"?"v":"r"; const u = o.kind==="t"?"sec":o.kind==="cm"?"cm":"reps";
        const p2 = o.kind==="t"? (o.targetT??"") : o.kind==="r"? (/^\d/.test(o.reps)? o.target : "") : "";
        h+=`<div class="setrow one ${z.done?"done":""}"><span class="sn">${n+1}</span><div class="unit"><input class="inp" inputmode="numeric" data-bind="${sb}/${fld}" value="${esc(z[fld]??"")}" placeholder="${p2??""}" aria-label="Set ${n+1} ${u}"><span>${u}</span></div>${TICK(z.done,`data-a="tick" ${kk}`,"Set "+(n+1)+" done")}</div>`;
      }
    }
    h+=`</div>`;
    h+=findItHTML(o,x);
    h+=`<div class="rpe" role="group" aria-label="RPE of the last set"><span class="lab">RPE</span>${[5,6,7,8,9,10].map(v=>`<button class="${+x.rpe===v?"on":""}" data-a="set" data-p="${base}/rpe" data-v="${v}">${v}</button>`).join("")}</div>`;
    h+=`<div class="cmt"><input class="inp txt" data-bind="${base}/cmt" value="${esc(x.cmt||"")}" placeholder="Your comments: different weight, how it felt" aria-label="Your comments"></div>`;
  }
  return h+`</div>`;
}
function findItHTML(o,x){
  const L=o.base.load; if(!L||typeof L!=="object") return "";
  const done=Object.values(x.sets||{}).filter(s=>s.done&&num(s.w)!=null);
  if(L.t==="tm" && tm(L.lift,1)==null && o.wi===0){
    const pick=done.filter(s=>num(s.r)>=3&&num(s.r)<=5).sort((a,b)=>b.w-a.w)[0];
    return `<div class="findit"><b>No starting number yet.</b> Build up in sets of 5 until one set feels like RPE 8, log it here, then save it. Every week after fills in.${pick?`<br><button class="btn sm" data-a="saveLift" data-l="${L.lift}" data-wt="${pick.w}" data-r="${pick.r}">Save ${fmtKg(+pick.w)} × ${pick.r} as my ${esc(liftName(L.lift))} number</button>`:""}</div>`;
  }

  }
  return "";
}
function finishHTML(wi,si){

/* ============================ charts (plain SVG) ============================ */
function lineChart(series,{h=150,yfmt=v=>fmtKg(Math.round(v*10)/10),xmin,xmax,lower}={}){
  const pts=series.flatMap(s=>s.pts); if(!pts.length) return '<p class="small muted">Nothing logged yet.</p>';
  const W_=360,H=Math.round(h*.62),pl=42,pr=8,pt=8,pb=18;
  const x0=xmin??Math.min(...pts.map(p=>p.x)), x1=xmax??Math.max(...pts.map(p=>p.x));
  let y0=Math.min(...pts.map(p=>p.y)), y1=Math.max(...pts.map(p=>p.y)); if(y0===y1){y0-=1;y1+=1;} const pad_=(y1-y0)*.15; y0-=pad_; y1+=pad_;
  const X=x=>pl+(x1===x0?0.5:(x-x0)/(x1-x0))*(W_-pl-pr), Y=y=>pt+(1-(y-y0)/(y1-y0))*(H-pt-pb);
  let g=`<svg viewBox="0 0 ${W_} ${H}" role="img">`;
  [y0+pad_, (y0+y1)/2, y1-pad_].forEach(v=>{ g+=`<line x1="${pl}" x2="${W_-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${yfmt(v)}</text>`; });
  series.forEach(s=>{
    const p=s.pts.slice().sort((a,b)=>a.x-b.x);
    if(p.length>1) g+=`<polyline fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" points="${p.map(q=>X(q.x)+","+Y(q.y)).join(" ")}"/>`;
    p.forEach(q=>{ g+=`<circle cx="${X(q.x)}" cy="${Y(q.y)}" r="${q.base?4:3.2}" fill="${q.base?"var(--surface)":s.c}" stroke="${s.c}" stroke-width="2"><title>${esc(q.t||"")} ${yfmt(q.y)}</title></circle>`; });
  });
  if(lower) g+=`<text x="${pl}" y="${H-3}">${esc(lower[0])}</text><text x="${W_-pr}" y="${H-3}" text-anchor="end">${esc(lower[1])}</text>`;
  return `<div class="chart">${g}</svg></div>`;
}
function barChart(vals,{h=120,max,labels}){
  const W_=360,H=Math.round(h*.62),pl=4,pr=4,pt=4,pb=16; const n=vals.length; const bw=(W_-pl-pr)/n;
  let g=`<svg viewBox="0 0 ${W_} ${H}" role="img">`;
  vals.forEach((v,i)=>{
    const x=pl+i*bw+bw*.18, w=bw*.64;
    g+=`<rect x="${x}" y="${pt}" width="${w}" height="${H-pt-pb}" rx="5" fill="var(--surface2)"/>`;
    if(v.v>0){ const hh=(H-pt-pb)*Math.min(1,v.v/max); g+=`<rect x="${x}" y="${H-pb-hh}" width="${w}" height="${hh}" rx="5" fill="${v.c}"><title>${esc(v.t)}</title></rect>`; }
    g+=`<text x="${x+w/2}" y="${H-3}" text-anchor="middle">${labels[i]}</text>`;
  });
  return `<div class="chart">${g}</svg></div>`;
}

/* ============================ progress ============================ */
const TESTS = [
  {k:"squat", label:"Squat", unit:"kg e1RM", lift:true, std:bw=>bw?fmtKg(r25(1.5*bw))+" kg for 5":"Needs bodyweight"},
  {k:"hinge", label:"Hinge (deadlift)", unit:"kg e1RM", lift:true, std:bw=>bw?fmtKg(r25(1.75*bw))+" kg for 5":"Needs bodyweight"},
  {k:"hpress", label:"Bench press", unit:"kg e1RM", lift:true, std:bw=>bw?fmtKg(r25(1*bw))+" kg for 5":"Needs bodyweight"},
  {k:"vpress", label:"Overhead press", unit:"kg e1RM", lift:true, std:()=>"-"},
  {k:"vpull", label:"Weighted pull up", unit:"kg added, best set", pull:true, std:()=>"-"},
  {k:"hpull", label:"Barbell row", unit:"kg, best set", pull:true, std:()=>"-"},
  {k:"pullups", label:"Max strict pull ups", unit:"reps", ex:"Max strict pull ups", f:"r", std:()=>"12+"},
  {k:"pushups", label:"Max push ups", unit:"reps", ex:"Max push ups", f:"r", std:()=>"50+"},
  {k:"dips", label:"Max dips", unit:"reps", ex:"Max dips", f:"r", std:()=>"30+"},
  {k:"plank", label:"Plank", unit:"sec", ex:"Plank", f:"t", std:()=>"180"},
  {k:"broad", label:"Broad jump", unit:"cm", ex:"Broad jump", f:"v", std:()=>num(S.profile.height)?S.profile.height+" cm (your height)":"Your height"},
  {k:"farmer", label:"Farmer carry at bodyweight", unit:"sec", ex:"Farmer carry at bodyweight", f:"t", std:()=>"60"},
  {k:"run", label:"3.2 km run", unit:"mm:ss", ex:"3.2 km (2 mile) time trial", f:"v", time:true, std:()=>"14:30"}
];
function testResult(t){
  const wi=W.length-1; let best=null;
  W[wi].sessions.forEach((s,si)=>s.items.forEach((it,ii)=>{
    const x=ilog(wi,si,ii); if(!x) return;
    const sets=Object.values(x.sets||{}).filter(z=>z.done);
    if(t.lift && typeof it.ex==="object" && it.ex.lift===t.k){ const e=bestE1(x); if(e!=null) best=e; }
    else if(t.pull && typeof it.ex==="object" && it.ex.lift===t.k){ sets.forEach(z=>{ if(num(z.w)!=null&&(best==null||+z.w>best)) best=+z.w; }); }
    else if(t.ex && it.ex===t.ex){ sets.forEach(z=>{ const v= t.time? parseMMSS(z.v) : num(z[t.f]); if(v!=null&&(best==null|| (t.time? v<best : v>best))) best=v; }); }
  }));
  return best;
}
function testBase(t){
  if(t.lift) return liftE1(t.k);
  if(t.pull) return num(S.profile.pulls[t.k].start);
  if(t.time) return parseMMSS(S.profile.tests.run);
  return num(S.profile.tests[t.k]);
}
function vProgress(){
  let h=topbar("Progress","Worked out from what you log");
  const t0=parseDate(S.profile.start).getTime(), t1=addDays(parseDate(S.profile.start),W.length*7).getTime();
  // adherence
  const cw=curWeek();
  const vals=W.map((w,wi)=>{ const s=weekStats(wi); return {v:s.done,c:isDeload(w)?"var(--c-core)":"var(--ink)",t:`${w.label}: ${s.done} of ${s.planned}`}; });
  const past=W.slice(0,cw.wi+1).reduce((a,w,wi)=>{ w.sessions.forEach((s,si)=>{ if(sessDate(wi,si)<=today()){ a.p++; if(sessStatus(wi,si)==="done") a.d++; } }); return a; },{p:0,d:0});
  h+=`<div class="panel"><div class="row between"><h3>Sessions done</h3><span class="num" style="font-size:24px;font-weight:700">${past.p?Math.round(past.d/past.p*100):0}%</span></div><p class="small muted">${past.d} of ${past.p} sessions due so far</p>${barChart(vals,{max:4,labels:W.map(w=>w.n===13?"T":w.n)})}</div><div class="sp"></div>`;
  // e1rm per lift
  h+=`<div class="panel"><h3>Estimated 1RM</h3><p class="small muted">Best set of 10 reps or fewer each session. Hollow dot is your starting number.</p>`;
  const cols={squat:"var(--c-main)",hinge:"var(--c-conditioning)",hpress:"var(--c-secondary)",vpress:"var(--c-core)"};
  LIFTS.forEach(k=>{
    const pts=[]; const b=liftE1(k); if(b!=null) pts.push({x:t0,y:b,base:1,t:"Start"});
    W.forEach((w,wi)=>w.sessions.forEach((s,si)=>s.items.forEach((it,ii)=>{ if(typeof it.ex==="object"&&it.ex.lift===k&&it.kind==="wr"){ const e=bestE1(ilog(wi,si,ii)); if(e!=null) pts.push({x:sessDate(wi,si).getTime(),y:e,t:fmtD(sessDate(wi,si))}); } })));
    const lastPt=pts.slice().sort((a,c)=>c.x-a.x)[0];
    h+=`<div style="margin-top:14px"><div class="row between"><b>${esc(liftName(k))}</b><span class="num" style="font-size:20px;font-weight:700">${lastPt?fmtKg(Math.round(lastPt.y*10)/10)+" kg":"-"}</span></div>${pts.length? lineChart([{pts,c:cols[k]}],{h:120,xmin:t0,xmax:t1,lower:["Week 1","Testing"]}) : '<p class="small muted">No number yet. Week 1 finds it.</p>'}</div>`;
  });
  h+=`</div><div class="sp"></div>`;
  // bodyweight + RPE
  const bw=Object.keys(S.checkins).map(k=>({x:weekStart(+k).getTime(),y:num(S.checkins[k].bw),t:W[+k].label})).filter(p=>p.y!=null);
  if(num(S.profile.bw)!=null) bw.unshift({x:t0,y:+S.profile.bw,base:1,t:"Profile"});
  h+=`<div class="panel"><h3>Bodyweight</h3><p class="small muted">From your weekly check-ins. Compare week to week, not day to day.</p>${lineChart([{pts:bw,c:"var(--c-secondary)"}],{h:120,xmin:t0,xmax:t1,lower:["Week 1","Testing"]})}</div><div class="sp"></div>`;
  const rp=[]; W.forEach((w,wi)=>w.sessions.forEach((s,si)=>{ const L=log(wi,si); if(L&&L.done&&num(L.rpe)!=null) rp.push({x:sessDate(wi,si).getTime(),y:+L.rpe,t:s.name}); }));
  h+=`<div class="panel"><h3>Session RPE</h3>${lineChart([{pts:rp,c:"var(--c-conditioning)"}],{h:110,xmin:t0,xmax:t1,yfmt:v=>Math.round(v),lower:["Week 1","Testing"]})}</div><div class="sp"></div>`;
  // tests
  const bwv=num(S.profile.bw);
  h+=`<div class="panel"><h3>Tests</h3><p class="small muted">Start numbers come from your profile. Testing week numbers fill in from what you log in the testing week.</p><div class="scroll"><table class="tbl"><thead><tr><th>Test</th><th>Start</th><th>Testing</th><th>Change</th><th>Standard</th></tr></thead><tbody>`;
  TESTS.forEach(t=>{
    const b=testBase(t), r=testResult(t);
    const f=v=> v==null? "-" : t.time? mmss(v) : fmtKg(Math.round(v*10)/10);
    let ch="-"; if(b!=null&&r!=null){ const d=r-b; ch = t.time? (d<=0?"-":"+")+mmss(Math.abs(d)) : (d>0?"+":"")+fmtKg(Math.round(d*10)/10); }
    h+=`<tr><td>${esc(t.label)}<div class="hint">${esc(t.unit)}</div></td><td class="n">${f(b)}</td><td class="n">${f(r)}</td><td class="n">${ch}</td><td class="small">${esc(t.std(bwv))}</td></tr>`;
  });
  h+=`</tbody></table></div><p class="hint">Standards are for under 40s.</p></div>`;
  return h;
}

/* ============================ check-ins ============================ */
function checkinDate(wi){ const ws=weekStart(wi); for(let i=0;i<7;i++){ const d=addDays(ws,i); if(d.getDay()===6) return d; } return addDays(ws,6); }
function checkinDue(){ const cw=curWeek(); if(cw.pre) return false; const c=S.checkins[cw.wi]; if(isCoach()) return Object.values(S.checkins).some(c=>c.sent&&!c.reply); return !(c&&c.sent) && dayDiff(today(),checkinDate(cw.wi))<=1; }
function scaleBtns(path,cur,arr,cls){ return `<div class="scale ${cls||""}">${arr.map(v=>{ const val=Array.isArray(v)?v[0]:v, lab=Array.isArray(v)?v[1]:v; return `<button class="${String(cur)===String(val)?"on":""}" data-a="set" data-p="${path}" data-v="${esc(val)}">${esc(lab)}</button>`; }).join("")}</div>`; }

  h+=`<div class="panel"><div class="row between"><h2>${esc(w.label)}</h2>${c.sent?`<span class="status done">Sent</span>`:""}</div>
    <dl class="kv" style="margin-top:10px"><dt>Sessions done</dt><dd class="num" style="font-size:20px;font-weight:700">${st.done} of ${st.planned}</dd><dt>Avg session RPE</dt><dd class="num" style="font-size:20px;font-weight:700">${st.rpe??"-"}</dd></dl><p class="hint">These fill in from your sessions.</p>`;
  if(c.reply||isCoach()) h+=`<div class="coachnote" style="margin:14px 0 0"><b>Coach reply</b>${isCoach()?`<textarea class="inp" rows="3" data-bind="${base}/reply" placeholder="Reply to this check-in">${esc(c.reply||"")}</textarea>`:`<p style="margin:4px 0 0">${esc(c.reply)}</p>`}</div>`;

/* ============================ coach ============================ */
function flags(){
  const out=[]; const cw=curWeek();
  Object.keys(S.checkins).forEach(k=>{ const c=S.checkins[k]; const wl=W[+k].label;
    if(num(c.painScore)>=4 || (c.pain&&num(c.painScore)!==0)) out.push({lvl:num(c.painScore)>=4?"bad":"warn",t:`${wl}: pain ${c.painScore??"?"}/10${c.pain?" ("+c.pain+")":""}`,h:"#/checkin/"+k});
    if(c.overall==="hard") out.push({lvl:"warn",t:`${wl}: said the week was too hard`,h:"#/checkin/"+k});
    if(c.overall==="easy") out.push({lvl:"warn",t:`${wl}: said the week was too easy`,h:"#/checkin/"+k});
    if(c.sent&&!c.reply) out.push({lvl:"info",t:`${wl}: check-in waiting for your reply`,h:"#/checkin/"+k});
  });
  W.forEach((w,wi)=>w.sessions.forEach((s,si)=>{ const st=sessStatus(wi,si); const L=log(wi,si);
    if(st==="miss") out.push({lvl:"warn",t:`${w.label}, ${s.name}: missed${L.missedWhy?" ("+L.missedWhy+")":""}`,h:`#/s/${wi}/${si}`});
    if(st==="past") out.push({lvl:"warn",t:`${w.label}, ${s.name}: not logged`,h:`#/s/${wi}/${si}`});
    if(L&&L.done&&num(L.rpe)>=9) out.push({lvl:"warn",t:`${w.label}, ${s.name}: session RPE ${L.rpe}`,h:`#/s/${wi}/${si}`});
    if(L&&L.feel&&/pain|hurt|sharp|injur|twinge|tweak|swell|niggle/i.test(L.feel)&&!/no pain|pain free|pain-free/i.test(L.feel)) out.push({lvl:"bad",t:`${w.label}, ${s.name}: "${L.feel}"`,h:`#/s/${wi}/${si}`});

function fuelVal(label){
  const bw=num(S.profile.bw); if(bw==null) return "-";

  if(/training hard/.test(label)) return `${R10(bw*35)} to ${R10(bw*37)} kcal`;

}

let T=null, Tint=null;
function startTimer(sec,label){ if(!sec) return; T={end:Date.now()+sec*1000,len:sec,label}; tickTimer(); clearInterval(Tint); Tint=setInterval(tickTimer,250); }
function tickTimer(){
  const el=document.getElementById("timer"); if(!T){ el.innerHTML=""; clearInterval(Tint); return; }
  const left=(T.end-Date.now())/1000;
  if(left<=0 && !T.over){ T.over=Date.now(); try{ navigator.vibrate&&navigator.vibrate([200,100,200]); }catch(e){} beep(); }
  if(T.over && Date.now()-T.over>4000){ T=null; el.innerHTML=""; clearInterval(Tint); return; }
  renderTimer();
  const e2=document.getElementById("elapsed"); if(e2) e2.textContent=mmss((Date.now()-+e2.dataset.start)/1000);
}
function renderTimer(){
  const el=document.getElementById("timer"); if(!T){ el.innerHTML=""; return; }
  const left=Math.max(0,(T.end-Date.now())/1000);
  el.innerHTML=`<div class="timer ${T.over?"over":""}" role="timer" aria-label="Rest timer"><div class="t">${T.over?"Go":mmss(left)}</div><div class="lab">${T.over?"Rest over":"Rest"}${T.label?`<br>${esc(T.label)}`:""}</div>${T.over?"":`<button data-a="t15">+15s</button><button data-a="tskip">Skip</button>`}<div class="prog"><i style="width:${T.over?100:100-left/T.len*100}%"></i></div></div>`;
}
let AC=null;
function beep(){ if(!S.settings.sound) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); [0,.25].forEach(t=>{ const o=AC.createOscillator(), g=AC.createGain(); o.frequency.value=880; o.connect(g); g.connect(AC.destination); g.gain.setValueAtTime(.0001,AC.currentTime+t); g.gain.exponentialRampToValueAtTime(.3,AC.currentTime+t+.02); g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t+.2); o.start(AC.currentTime+t); o.stop(AC.currentTime+t+.22); }); }catch(e){} }
setInterval(()=>{ if(!T){ const e2=document.getElementById("elapsed"); if(e2) e2.textContent=mmss((Date.now()-+e2.dataset.start)/1000); } },1000);

function toast(msg){ document.querySelectorAll(".toast").forEach(t=>t.remove()); const d=document.createElement("div"); d.className="toast"; d.setAttribute("role","status"); d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }

/* ============================ actions ============================ */
function refreshItem(wi,si,ii){
  const el=document.getElementById("it"+ii); if(!el){ render(); return; }
  const open=!!(el.querySelector("details")||{}).open;
  const g=groupsOf(wi,si).find(g=>g.idx.includes(ii));
  el.outerHTML=itemHTML(R(wi,si,ii),g);
  if(open){ const d=document.querySelector("#it"+ii+" details"); if(d) d.open=true; }
  const pg=document.getElementById("pgcount"); if(pg){ const p=sessionProgress(wi,si); pg.textContent=p.dn+" of "+p.tot; }
}
const D = el => ({wi:+el.dataset.w, si:+el.dataset.s, ii:+el.dataset.i});
function ensureStart(wi,si){ const L=log(wi,si,true); if(!L.start && !L.done){ L.start=Date.now(); return true; } return false; }
const A = {
  go(el){ go(el.dataset.h); },
  back(el){ go(el.dataset.h); },
  role(){ S.settings.role = isCoach()?"client":"coach"; save(); toast(isCoach()?"Coach view":"Athlete view"); render(); },
  setrole(el){ S.settings.role=el.dataset.v; save(); render(); },
  theme(el){ S.settings.theme=el.dataset.v; save(); render(); },
  sound(el){ S.settings.sound=el.dataset.v==="1"; save(); render(); },
  start(el){ const {wi,si}=D(el); log(wi,si,true).start=Date.now(); save(); render(); },
  check(el){
    const {wi,si,ii}=D(el); const x=ilog(wi,si,ii,true); const o=R(wi,si,ii); const fresh=ensureStart(wi,si);
    x.done=!x.done;
    if(x.done && o.kind==="cardio" && (x.mins==null||x.mins==="")) x.mins=firstNum(o.reps);
    save(); fresh? render() : refreshItem(wi,si,ii);
  },
  tick(el){
    const {wi,si,ii}=D(el); const k=el.dataset.k; const o=R(wi,si,ii); const x=ilog(wi,si,ii,true); const fresh=ensureStart(wi,si);
    const z=x.sets[k]||(x.sets[k]={});
    if(z.done){ z.done=false; save(); refreshItem(wi,si,ii); return; }
    const blank=v=>v==null||v==="";
    const need=(f,fill)=>{ if(blank(z[f])&&fill!=null&&fill!=="") z[f]=fill; return !blank(z[f]); };
    let ok=true;
    if(o.kind==="wr"){ need("w",o.load); ok=need("r",/^\d/.test(o.reps)?o.target:null); }
    else if(o.kind==="wt"){ need("w",o.load); ok=need("t",o.targetT); }
    else if(o.kind==="t"){ ok=need("t",o.targetT); }
    else if(o.kind==="r"){ ok=need("r",/^\d/.test(o.reps)?o.target:null); }
    else if(o.kind==="cm"||o.kind==="runtime"){ ok=need("v",null); }
    if(!ok){ const inp=el.closest(".setrow").querySelector("input:not([value]),input"); const empties=[...el.closest(".setrow").querySelectorAll("input")].filter(i=>!i.value); (empties[empties.length-1]||inp).focus(); toast("Type what you did, then tick"); return; }
    z.done=true; z.at=Date.now(); save(); fresh? render() : refreshItem(wi,si,ii);
    // rest timer: supersets get ~30s to move to the next exercise, then the group rest
    const g=groupsOf(wi,si).find(g=>g.idx.includes(ii));
    if(g&&g.type==="ss"&&g.idx.indexOf(ii)<g.idx.length-1){ const nx=R(wi,si,g.idx[g.idx.indexOf(ii)+1]); startTimer(30,`Then ${nx.code}, ${nx.name}`); }
    else { let sec=restSec(o.rest); if(!sec&&g&&g.type==="ss") sec=Math.max(0,...g.idx.map(j=>restSec(R(wi,si,j).rest))); const nxt = g&&g.type==="ss" ? `Then ${R(wi,si,g.idx[0]).code} again` : ""; if(sec) startTimer(sec,nxt); }
  },
  set(el){
    const p=el.dataset.p; let v=el.dataset.v; if(num(v)!=null) v=+v;
    const cur=getPath(S,p); const nv = String(cur)===String(v)? null : v; setPath(S,p,nv); save();
    el.parentElement.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b===el && nv!=null));
  },
  finish(el){
    const {wi,si}=D(el); const L=log(wi,si,true);
    if(num(L.rpe)==null){ toast("Pick a session RPE first"); const sc=el.closest(".finish").querySelector(".scale"); if(sc) sc.scrollIntoView({block:"center",behavior:"smooth"}); return; }
    if(!L.minutes && L.start) L.minutes=Math.max(1,Math.round((Date.now()-L.start)/60000));
    L.done=true; L.end=Date.now(); L.missed=false; save(true); T=null; toast("Session saved"); render(); window.scrollTo(0,0);
  },
  miss(el){ const {wi,si}=D(el); openSheet(`<h2>Mark as missed</h2><p class="small muted">Tell your coach why. Do not cram two sessions into one day to catch up, your coach will adjust the week.</p><label class="f" for="why">Reason</label><textarea id="why" class="inp" placeholder="e.g. ill, work, travel"></textarea><div class="row" style="margin-top:14px"><button class="btn grow" data-a="domiss" data-w="${wi}" data-s="${si}">Mark missed</button><button class="btn ghost" data-a="close">Cancel</button></div>`); },
  domiss(el){ const {wi,si}=D(el); const L=log(wi,si,true); L.missed=true; L.missedWhy=document.getElementById("why").value; save(true); closeSheet(); render(); },
  unmiss(el){ const {wi,si}=D(el); const L=log(wi,si,true); L.missed=false; save(); render(); },
  reopen(el){ const {wi,si}=D(el); log(wi,si,true).done=false; save(); render(); },
  saveLift(el){ const l=el.dataset.l; S.profile.lifts[l].w=+el.dataset.wt; S.profile.lifts[l].r=+el.dataset.r; save(true); toast(liftName(l)+" saved. Your weights are filled in."); render(); },
  savePull(el){ const l=el.dataset.l; S.profile.pulls[l].start=+el.dataset.wt; save(true); toast("Start load saved"); render(); },
  lib(el){ libSheet(el.dataset.n); },
  edit(el){ const {wi,si,ii}=D(el); editSheet(wi,si,ii); },
  saveedit(el){
    const key=el.dataset.k; const f=document.getElementById("editf"); const [wi,si,ii]=key.split(".").map(Number); const base=W[wi].sessions[si].items[ii];
    const ed={}; ["ex","sets","reps","load","effort","rest","notes"].forEach(n=>{ const i=f.elements[n]; if(!i) return; const v=i.value.trim(); const b=base[n]; const bs=(b&&typeof b==="object")?"":(b==null?"":String(b));
      if(n==="notes"||n==="reps"||n==="load"){ if(v!=="" && v!==bs) ed[n]=v; } else if(v!==bs) ed[n]=v; });
    if(Object.keys(ed).length) S.edits[key]=ed; else delete S.edits[key];
    if(ed.ex && f.elements.later && f.elements.later.checked){ let n=0;
      W.forEach((w,a)=>{ if(a<=wi) return; w.sessions.forEach((s,b)=>s.items.forEach((it,c)=>{ if(it.ex===base.ex){ const k2=a+"."+b+"."+c; S.edits[k2]=Object.assign({},S.edits[k2]||{},{ex:ed.ex}); n++; } })); });
      if(n) toast(`Swapped in ${n} later session${n>1?"s":""}`); }
    save(true); closeSheet(); toast("Plan updated"); render();
  },
  clearedit(el){ delete S.edits[el.dataset.k]; save(true); closeSheet(); render(); },
  close(el,e){ if(e && el.classList.contains("scrim") && e.target!==el) return; closeSheet(); },
  t15(){ if(T){ T.end+=15000; T.len+=15; renderTimer(); } },
  tskip(){ T=null; renderTimer(); },
  sendci(el){ const wi=+el.dataset.w; const c=S.checkins[wi]||(S.checkins[wi]={}); c.sent=Date.now(); save(true); toast("Check-in sent"); render(); },
  export(){ download(`trainingtracker-backup-${iso(today())}.json`, JSON.stringify(S,null,1), "application/json"); },
  csv(){
    const rows=[["date","week","session","code","exercise","set","kg","reps","seconds","other","done","rpe","comment"]];
    W.forEach((w,wi)=>w.sessions.forEach((s,si)=>{ const L=log(wi,si); if(!L) return; s.items.forEach((it,ii)=>{ const x=L.items[ii]; if(!x) return; const o=R(wi,si,ii);
      const sets=Object.keys(x.sets||{}); if(!sets.length) rows.push([iso(sessDate(wi,si)),w.label,s.name,o.code,o.name,"","","","",x.rounds||x.mins||x.note||"",x.done?"Y":"",x.rpe||"",x.cmt||""]);
      sets.forEach(k=>{ const z=x.sets[k]; rows.push([iso(sessDate(wi,si)),w.label,s.name,o.code,o.name,+k+1,z.w??"",z.r??"",z.t??"",z.v??"",z.done?"Y":"",x.rpe||"",x.cmt||""]); }); }); }));
    download(`trainingtracker-sets-${iso(today())}.csv`, rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n"), "text/csv");
  },
  reset(){ if(confirm("Clear all logged data on this device? Export a backup first if you want to keep it.")){ S=fresh(); save(true); T=null; go("#/today"); render(); } }
};
function download(name,text,type){ const b=new Blob([text],{type}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); }

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]"); if(!el) return;
  if(el.tagName==="A") return;
  const f=A[el.dataset.a]; if(f){ if(el.tagName==="BUTTON") e.preventDefault(); f(el,e); }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.bind){
    let v=t.value;
    if((t.dataset.num||t.inputMode==="decimal"||t.inputMode==="numeric") && v!=="" && !isNaN(+v)) v=+v;
    if(t.dataset.num && v==="") v=null;
    setPath(S,t.dataset.bind,v); save();
  }
  if(t.dataset.aInput==="libsearch") document.getElementById("liblist").innerHTML=libList(t.value);
  if(t.dataset.aInput==="termsearch"){
    const q=t.value.toLowerCase(); const a=DATA.intro.findIndex(r=>r[0]==="Terms"); const rows=DATA.intro.slice(a);
    const keep=[]; rows.forEach((r,i)=>{ if(!r[1]){ keep.push(r); return; } if(!q||(r[0]+" "+r[1]).toLowerCase().includes(q)) keep.push(r); });
    const clean=keep.filter((r,i)=> r[1] || (keep[i+1]&&keep[i+1][1]));
    document.getElementById("termlist").innerHTML = clean.length? sectionRows(clean) : '<p class="small muted">No match.</p>';
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.aFile==="import" && t.files[0]){
    const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d||!d.profile||!d.logs) throw new Error("Not a Training Tracker backup"); S=Object.assign(fresh(),d); S.settings=Object.assign(fresh().settings,d.settings||{}); save(true); toast("Backup imported"); render(); }catch(err){ toast("Import failed: "+err.message); } }; r.readAsText(t.files[0]);
    return;
  }
  if(t.dataset.bind && /^(profile|settings)\//.test(t.dataset.bind)){
    setTimeout(()=>{ const a=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.bind; const y=window.scrollY; render(); window.scrollTo(0,y); if(a){ const n=document.querySelector(`[data-bind="${CSS.escape(a)}"]`); if(n) n.focus({preventScroll:true}); } },0);
  }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });

if(!location.hash) history.replaceState(null,"","#/today");
render();

</script>
